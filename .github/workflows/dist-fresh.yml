name: dist-fresh

# 检查 dist/ 有没有落后于源码（ai-reviewer#168）。只读：不需要任何写权限，也不用 Secret。
permissions:
  contents: read

on:
  # 发布 PR（develop → main）必须新鲜：配合分支保护把它设为 main 的必需检查
  pull_request:
    branches: [main]
  # 合入之后的提醒：落后就变红，提示补一个“重新打包 dist”的提交
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  dist-fresh:
    runs-on: ubuntu-latest
    steps:
      # 按你们 versioning.yml 的惯例固定到完整 commit SHA；下面是 actions/checkout v4 当前的 SHA，
      # 提交前请用 `gh api repos/actions/checkout/commits/v4 --jq .sha` 再核对一次
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 必须完整历史：脚本要判断 SOURCE_SHA 是不是祖先，并比较它与 HEAD 之间的文件差异
          fetch-depth: 0
      - name: dist 必须与源码一致
        run: node scripts/check-dist-fresh.js
