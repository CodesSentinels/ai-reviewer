name: OpenAI Reviewer

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

concurrency:
  # Comment events key on comment.id so that rapid consecutive comments on the
  # same PR each get their own group and run in parallel — otherwise they share
  # one group and, with cancel-in-progress disabled, a queued run is evicted
  # (skipped) by the next comment. Non-comment events fall back to 'pr'.
  group:
    ${{ github.repository }}-${{ github.event.number || github.head_ref ||
    github.sha }}-${{ github.workflow }}-${{ github.event.comment.id || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' &&
    github.event_name != 'issue_comment' }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: ${{github.event.pull_request.head.repo.full_name}}
          ref: ${{github.event.pull_request.head.ref}}
          submodules: false
      - name: Install ripgrep
        run: |
          if ! command -v rg &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: true
          review_comment_lgtm: false
          openai_heavy_model: gpt-5.4-mini
          path_filters: |
            !dist/**
            !**/*.lock
