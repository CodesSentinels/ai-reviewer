# OpenAI Reviewer
#
# 安全不变式（SEC-001~005，改动本文件前必读）：
#
#   本 workflow 由 pull_request_target 触发，因此持有 base 仓库的写权限 token
#   和 OPENAI_API_KEY。任何能开 PR 的人（包括 fork）都能控制 PR head 的内容。
#   所以本 job 绝不能 checkout 或执行 PR head 中的任何东西——Action 代码、
#   dist/index.js、依赖、package script、lint 配置都不行。
#
#   PR 的 diff 与文件内容由 Action 通过 GitHub API 以「数据」方式读取
#   （见 src/review.ts 的 listRepositoryTree / getFileContent），
#   工作区里不需要、也不允许出现 PR 代码。
name: OpenAI Reviewer

# SEC-006：最小权限。contents 只读用于 checkout 默认分支，
# pull-requests 写用于发布摘要、行级评论和命令回复。
permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

concurrency:
  # Comment events key on comment.id so that rapid consecutive comments on the
  # same PR each get their own group and run in parallel — otherwise they share
  # one group and, with cancel-in-progress disabled, a queued run is evicted
  # (skipped) by the next comment. Non-comment events fall back to 'pr'.
  group:
    ${{ github.repository }}-${{ github.event.number || github.head_ref ||
    github.sha }}-${{ github.workflow }}-${{ github.event.comment.id || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' &&
    github.event_name != 'issue_comment' }}

jobs:
  # ─── 元数据解析：持只读 token，但**绝不 checkout 任何代码**（SEC-004）──────
  #
  # 评论事件（issue_comment / pull_request_review_comment）的 payload 里没有
  # head/base SHA，只能查 API。查询要 token，而**执行 PR 代码的 lint 步骤不接收
  # token 或业务密钥**——因此单独拆一个 job：查 API 的这个 job 完全不 checkout，
  # lint job 的只读 token 只出现在执行 PR 代码之前的 checkout / fetch 步骤里。
  #
  # 统一走 API（PR 事件也不例外），这样本 job 完全不引用 pull_request.head.*，
  # 与「持密钥 job 不得出现 PR head 引用」的门禁不冲突。
  resolve-pr:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq '"head_sha=" + .head.sha, "base_sha=" + .base.sha, "head_repo=" + .head.repo.full_name' \
            >> "$GITHUB_OUTPUT"

  # ─── 不可信执行面：跑 lint（SEC-002 / SEC-004）─────────────────────────────
  #
  # 本 job 的安全不变式（不是「没有任何 token」——checkout 私有仓库必须要有）：
  #
  #   1. 不持有业务密钥（OPENAI_API_KEY 等），也不持有任何写权限
  #   2. 只读 GITHUB_TOKEN 仅用于**执行 PR 代码之前**的可信步骤：两个
  #      checkout 和 base 历史 fetch
  #   3. 真正执行 PR 代码的步骤（Run lint tools）不带任何凭据
  #   4. 凭据不落工作区：checkout 全部 persist-credentials: false，
  #      fetch 用 `git -c http.extraheader` 内联传头，不写进 .git/config
  lint:
    needs: [resolve-pr]
    # PR 事件与评论事件都要跑：评论触发的 review/full review/summary 同样需要
    # lint 结果，而 download-artifact 只能看到**当前 run** 的产物，拿不到历史
    if: needs.resolve-pr.outputs.head_sha != ''
    # 必须是 GitHub 托管的临时 runner：本 job 会执行 PR 自带的 lint 配置，
    # 持久化的 self-hosted runner 会让这种执行在多次运行之间留下痕迹
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 可信侧：默认分支的代码与已提交的 lint-only bundle。
      # CLI 只从这里执行，绝不从 pr/ 解析入口、插件或依赖。
      - name: Checkout trusted reviewer code (default branch)
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          submodules: false

      # 不可信侧：PR head，**只作为扫描对象**，物理隔离在 pr/ 子目录。
      # head SHA 来自 resolve-pr 的 API 查询，不是 PR 可控的分支名。
      # fetch-depth: 0 是为了让本地 git diff 能同时看到 base 与 head。
      - name: Checkout PR head into pr/ (untrusted, scan target only)
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          repository: ${{ needs.resolve-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-pr.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      # base 通常不在 fork 的历史里，显式取回来。
      #
      # 这里**不能**用浅 fetch：那会把 base 标成浅历史边界，于是
      # `git diff base...head` 直接报 "no merge base"，CLI 降级成空报告——
      # lint 静默失效。fork 落后/分叉于最新 base 时必然踩到。
      # 取完之后显式验证 merge-base，拿不到就逐步 deepen，最后仍失败则
      # 明确记录降级原因，而不是留给下游猜。
      - name: Fetch base commit and ensure a merge base exists
        id: fetch-base
        continue-on-error: true
        working-directory: pr
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          UPSTREAM: https://github.com/${{ github.repository }}.git
          # 只读 token，仅用于取回 base 历史（LINT-009）。
          #
          # 这不是新引入的凭据面：actions/checkout 的 token 默认就是
          # ${{ github.token }}，上面两个 checkout 一直在用它拉取代码。
          # 真正的不变式是「执行 PR 代码的那一步不带凭据，且凭据不落到工作区」——
          # 本步骤跑在任何 PR 代码之前，用 -c 内联传头、不写进 .git/config，
          # 两个 checkout 也都设了 persist-credentials: false。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          # 同仓库 PR（非 fork）时 base 本来就在历史里，完全不需要 fetch
          if git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            echo "merge base already reachable, no fetch needed"
            exit 0
          fi

          # 跨仓库 fork：base 不在 fork 历史里，从 upstream 取回。
          # 带认证才能覆盖私有仓库；不用 set -x、不回显 AUTH，避免 base64 泄漏。
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$AUTH" fetch --no-tags "$UPSTREAM" "$BASE_SHA" || true

          if git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            echo "merge base found after fetching base"
            exit 0
          fi

          # 仓库若因任何原因仍是浅的，先补全再逐步加深
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git -c http.extraheader="$AUTH" fetch --unshallow "$UPSTREAM" || true
          fi
          for depth in 50 200 1000; do
            git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1 && break
            git -c http.extraheader="$AUTH" fetch --no-tags --deepen="$depth" "$UPSTREAM" "$BASE_SHA" || true
          done

          if git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            echo "merge base found after deepening"
          else
            # 降级必须是**显眼**的：lint 静默失效是最难发现的故障形态
            echo "::warning::no merge base between $BASE_SHA and $HEAD_SHA — lint skipped."
          fi

      # 从**可信** checkout 执行；被扫描的是 pr/。
      # 不跑 PR 的 npm install / 生命周期脚本 / package scripts——lint 工具由
      # tool-installer 装进 /tmp 沙箱，与被扫描仓库的 node_modules 无关。
      - name: Run lint tools against PR head
        id: lint
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: |
          node dist/lint-report/index.js \
            --repo-root pr \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --out lint-report.json \
            || bash .github/scripts/run-lint-report.sh

      - name: Upload report (data only, never executable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: lint-report.json
          if-no-files-found: warn
          retention-days: 1

  review:
    runs-on: ubuntu-latest
    # lint 失败/跳过都不能挡住审查：always() + 下面对产物存在性的容错
    needs: [resolve-pr, lint]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      # SEC-001 / SEC-003：固定 checkout 默认分支的可信代码。
      #
      # 绝不能加回 `repository: ${{ github.event.pull_request.head.repo.full_name }}`
      # 或 `ref: ${{ github.event.pull_request.head.ref }}`——那等于把本 job 的
      # 密钥交给任何能开 PR 的人。default_branch 对三种触发事件都可用
      # （pull_request_target / issue_comment / pull_request_review_comment）。
      #
      # 附带影响：修改 reviewer 自身的 PR，其审查由默认分支上的版本执行，
      # 不会用 PR 里的新版本自审——这是 SEC-003 要求的结果，不是缺陷。
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          ref: ${{ github.event.repository.default_branch }}
          # 不把 token 写进 .git/config，避免后续步骤意外拿到凭据
          persist-credentials: false
          submodules: false

      # SEC-005：只下载**数据**，且落到独立目录，不进工作区、不参与任何执行。
      # 报告在 reviewer 内部经 lint/report-schema.ts 严格校验后才使用。
      - name: Download lint report (untrusted data)
        id: report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lint-report
          path: ${{ runner.temp }}/lint-report

      - uses: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: true
          review_comment_lgtm: false
          openai_heavy_model: gpt-5.4-mini
          # SEC-004 / SEC-005：本 job 持有密钥，不能执行 PR 代码，
          # 因此本地工具保持关闭；lint 结果改由上面的低权限 lint job 提供。
          #
          # lint 尤其危险：eslint 适配器会探测并让 eslint require() 仓库里的
          # eslint.config.js / .eslintrc.js（src/lint/adapters/eslint.ts），
          # 这些是可执行 JS——在有密钥的 job 里跑等同于任意代码执行。
          enable_shell: false
          enable_lint_tools: false
          lint_report_path: ${{ runner.temp }}/lint-report/lint-report.json
          path_filters: |
            !dist/**
            !**/*.lock
